isli_version: "2.0"
id: "n8n-orchestrator-wan"
name: "n8n Orchestrator WAN"
description: "Full n8n instance management. Create, update, and manage n8n workflows and executions with strict JSON validation."
version: "1.3.0"
author: "ISLI AI"
category: "automation"

runtime:
  port: 8000
  build:
    context: "."
    dockerfile: "Dockerfile"

auth:
  type: "internal_jwt"

config:
  - key: N8N_API_KEY
    label: "n8n API Key"
    description: "Personal API Key for n8n"
    required: true
    secret: true
  - key: N8N_HOST
    label: "n8n Host URL"
    description: "The host URL of the target n8n instance"
    default: "http://host.docker.internal:5678"
    required: false
    secret: false

tools:
  - name: "get_workflows"
    description: "Get all workflows from n8n"
    endpoint: "get_workflows"
    method: "POST"
    parameters:
      type: "object"
      properties: {}

  - name: "create_workflow"
    description: "Create a new workflow in n8n. Payload is strictly validated."
    endpoint: "create_workflow"
    method: "POST"
    parameters:
      type: "object"
      properties:
        name: { type: "string", description: "Name of the workflow" }
        nodes: { type: "array", description: "List of nodes in the workflow" }
        connections: { type: "object", description: "Connections between nodes" }
        settings: { type: "object", description: "Workflow settings" }
      required: ["name", "nodes"]

  - name: "update_workflow"
    description: "Update an existing workflow with smart merge. Supports partial updates and guarantees required structure."
    endpoint: "update_workflow"
    method: "POST"
    parameters:
      type: "object"
      properties:
        workflow_id: { type: "string", description: "ID of the workflow to update" }
        name: { type: "string", description: "Name of the workflow" }
        nodes: { type: "array", description: "List of nodes in the workflow" }
        connections: { type: "object", description: "Connections between nodes" }
        settings: { type: "object", description: "Workflow settings" }
      required: ["workflow_id"]

  - name: "activate_workflow"
    description: "Activate / publish a workflow in n8n (requires a trigger/webhook/polling node)"
    endpoint: "activate_workflow"
    method: "POST"
    parameters:
      type: "object"
      properties:
        workflow_id: { type: "string", description: "ID of the workflow to activate" }
      required: ["workflow_id"]

  - name: "deactivate_workflow"
    description: "Deactivate / unpublish a workflow in n8n"
    endpoint: "deactivate_workflow"
    method: "POST"
    parameters:
      type: "object"
      properties:
        workflow_id: { type: "string", description: "ID of the workflow to deactivate" }
      required: ["workflow_id"]

  - name: "trigger_execution"
    description: "Trigger an on-demand execution for a workflow by calling its Webhook node URL"
    endpoint: "trigger_execution"
    method: "POST"
    parameters:
      type: "object"
      properties:
        workflow_id: { type: "string", description: "ID of the workflow to trigger" }
        payload: { type: "object", description: "Optional JSON payload to pass to the webhook" }
      required: ["workflow_id"]

  - name: "get_execution"
    description: "Get execution details"
    endpoint: "get_execution"
    method: "POST"
    parameters:
      type: "object"
      properties:
        execution_id: { type: "string", description: "ID of the execution to retrieve" }
      required: ["execution_id"]
